[package]
name = "mdyar"
version = "0.2.0"
description = "MDyar — BiDi-first Markdown editor"
authors = ["MDyar contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "mdyar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
